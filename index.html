<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gift</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d1238;font-family:'Press Start 2P',monospace;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}

#prompt{position:fixed;top:4vh;left:50%;transform:translateX(-50%);padding:.9em 1.2em;background:#2b1740;color:#ffe066;border:4px solid #fff;box-shadow:0 0 0 4px #2b1740,8px 8px 0 4px rgba(0,0,0,.35);font-size:clamp(9px,2.4vh,20px);line-height:1.6;text-align:center;max-width:88vw;display:none;z-index:5}
#prompt.show{display:block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

#dialog{position:fixed;bottom:3vh;left:50%;width:min(920px,94vw);transform:translate(-50%,160%);transition:transform .4s steps(6);display:flex;gap:16px;align-items:flex-end;z-index:5}
#dialog.show{transform:translate(-50%,0)}
.portrait{flex:none;width:17vh;height:17vh;background:#ffe3f2;border:4px solid #2b1740;box-shadow:0 0 0 4px #fff,0 0 0 8px #2b1740;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.portrait canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.box{position:relative;flex:1;min-height:12vh;background:#fff7fc;color:#3a1d4f;border:4px solid #2b1740;box-shadow:0 0 0 4px #fff,0 0 0 8px #2b1740;padding:1.4em 1.2em 1em;font-size:clamp(10px,2.4vh,22px);line-height:1.8}
#dname{position:absolute;top:-1.5em;left:1em;background:#ff6fb5;color:#fff;padding:.45em .8em;border:4px solid #2b1740;font-size:.7em}
.next{position:absolute;right:.8em;bottom:.5em;font-size:.7em;color:#ff4f9a;animation:blink .6s steps(2) infinite;display:none}
#dialog.done .next{display:block}

.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#2b1740;border:4px solid #2b1740;padding:.45em .6em .35em;box-shadow:4px 4px 0 rgba(0,0,0,.3);animation:pop .3s steps(4) both;z-index:4;white-space:nowrap;display:flex;gap:.2em;align-items:center}
.bubble::after{content:'';position:absolute;left:calc(50% - 8px);bottom:-14px;width:8px;height:6px;background:#fff;border:4px solid #2b1740;border-top:0}
@keyframes pop{from{transform:translate(-50%,-100%) scale(0)}70%{transform:translate(-50%,-100%) scale(1.25)}to{transform:translate(-50%,-100%) scale(1)}}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

.title{position:fixed;left:0;right:0;top:5vh;text-align:center;pointer-events:none;z-index:3}
.title .line{white-space:nowrap;margin:.35em 0}
#t1{font-size:min(5.2vw,5.4vh)}
@media (orientation:portrait){.title,#t2{top:16vh}}
#t2{font-size:min(9vw,10vh);top:6vh}
#t2.beat{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%,40%{transform:scale(1.07)}}
.ch{display:inline-block;animation:drop 1s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}
.ch.sp{width:.6em}
.in{display:inline-block;animation:wave 1.5s ease-in-out infinite,hue 2.4s linear infinite;animation-delay:calc(var(--d) * 1.6),calc(var(--d) * 2);
  color:#ff8fc8;text-shadow:.09em 0 #4a1036,-.09em 0 #4a1036,0 .09em #4a1036,0 -.09em #4a1036,.09em .09em #4a1036,-.09em .09em #4a1036,.09em -.09em #4a1036,-.09em -.09em #4a1036,.18em .2em 0 #ff3d8b,0 0 .5em rgba(255,140,200,.8)}
.in svg{width:1em;height:.86em;vertical-align:-.05em;filter:drop-shadow(.08em .08em 0 #4a1036)}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-25deg);opacity:0}10%{opacity:1}75%{transform:translateY(.15em) rotate(4deg)}100%{transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.22em)}}
@keyframes hue{0%,100%{color:#ff8fc8}25%{color:#ffd1ec}50%{color:#ff5fa8}75%{color:#d9a6ff}}
.ch.bye{animation:bye .9s ease-in both;animation-delay:var(--d)}
@keyframes bye{to{transform:translateY(-120vh) rotate(30deg) scale(.5);opacity:0}}
.ch.popin{animation:popin .8s cubic-bezier(.3,1.7,.5,1) both;animation-delay:var(--d)}
@keyframes popin{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}

#pad{position:fixed;left:3vw;bottom:4vh;display:none;gap:14px;z-index:6}
#xbtn{position:fixed;right:5vw;bottom:5vh;display:none;z-index:7}
.pbtn{width:68px;height:68px;font:inherit;font-size:22px;color:#fff;background:#ff6fb5;border:4px solid #2b1740;box-shadow:inset -4px -4px 0 #c43c86,inset 4px 4px 0 #ffb3dc,4px 4px 0 rgba(0,0,0,.35);touch-action:none}
.pbtn:active{transform:translate(2px,2px);box-shadow:inset -4px -4px 0 #c43c86,inset 4px 4px 0 #ffb3dc}
#xbtn .pbtn{width:84px;height:84px;font-size:30px;background:#ffcf3f;box-shadow:inset -4px -4px 0 #c99a17,inset 4px 4px 0 #fff0b3,4px 4px 0 rgba(0,0,0,.35);color:#2b1740;animation:blink 1s steps(2) infinite}
</style></head><body>
<canvas id="game"></canvas>
<div id="prompt"></div>
<div id="dialog"><div class="portrait"><canvas id="pc"></canvas></div><div class="box"><div id="dname"></div><div id="dtext"></div><span class="next">▼</span></div></div>
<div id="t1" class="title"></div>
<div id="t2" class="title"></div>
<div id="flash"></div>
<div id="pad"><button class="pbtn" data-k="arrowleft">◀</button><button class="pbtn" data-k="arrowright">▶</button></div>
<div id="xbtn"><button class="pbtn">X</button></div>

const IMG = {};

// ---- layout ----
let VW, VH, S, GY, BX, bg;
function resize() {
  S = Math.min(innerHeight / 180, innerWidth / 200);
  VW = Math.ceil(innerWidth / S); VH = Math.ceil(innerHeight / S);
  cv.width = VW * 4; cv.height = VH * 4; g.imageSmoothingEnabled = false;
  GY = Math.round(VH * 0.8);
  BX = Math.round(VW * 0.62);
  if (phase !== 'walk') kur.x = BX - 26;
  if (cin.mode !== 'hidden' && cin.mode !== 'fly') cin.x = BX + 36;
  bg = makeBg();
}

// seeded random for stable scenery
function srand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
let stars = [];
function makeBg() {
  const c = document.createElement('canvas'); c.width = VW; c.height = VH;
  const x = c.getContext('2d');
  const sky = ['#1d1238','#2a1a4f','#3d2566','#56307d','#7a3f93','#a352a3','#cf6fb2','#f59bc4'];
  const bh = GY / sky.length;
  for (let y = 0; y < GY; y++) {
    const f = y / bh, i = Math.floor(f), fr = f - i;
    for (let xx = 0; xx < VW; xx++) {
      // ordered dither between bands
      const th = [0.2, 0.6, 0.8, 0.4][(xx & 1) + 2 * (y & 1)];
      x.fillStyle = sky[Math.min(sky.length - 1, fr > th ? i + 1 : i)];
      x.fillRect(xx, y, 1, 1);
    }
  }
  // moon
  const mx = VW - 42, my = 30, mr = 11;
  for (let yy = -mr; yy <= mr; yy++) for (let xx = -mr; xx <= mr; xx++) {
    if (xx * xx + yy * yy <= mr * mr) {
      const cut = (xx + 5) ** 2 + (yy - 3) ** 2 <= (mr - 1) ** 2;
      if (!cut) { x.fillStyle = (xx + yy < -6) ? '#fffbe6' : '#ffe9a8'; x.fillRect(mx + xx, my + yy, 1, 1); }
    }
  }
  // hills
  const r = srand(7);
  const ph = r() * 6;
  for (let xx = 0; xx < VW; xx++) {
    const h = 14 + Math.sin(xx / 23 + ph) * 6 + Math.sin(xx / 9) * 2;
    x.fillStyle = '#3b2560'; x.fillRect(xx, GY - Math.round(h), 1, Math.round(h));
    const h2 = 7 + Math.sin(xx / 15 + 2) * 3;
    x.fillStyle = '#4b2f73'; x.fillRect(xx, GY - Math.round(h2), 1, Math.round(h2));
  }
  // ground
  for (let yy = GY; yy < VH; yy++) for (let xx = 0; xx < VW; xx += 8) {
    x.fillStyle = (((xx >> 3) + ((yy - GY) >> 3)) & 1) ? '#4a2d66' : '#553473';
    x.fillRect(xx, yy, 8, 1);
  }
  x.fillStyle = '#c9a0ef'; x.fillRect(0, GY, VW, 1);
  x.fillStyle = '#9b6bd0'; x.fillRect(0, GY + 1, VW, 2);
  x.fillStyle = '#6e45a0'; x.fillRect(0, GY + 3, VW, 1);
  for (let i = 0; i < VW / 14; i++) { // tiny flowers
    const fx = Math.floor(r() * VW), fy = GY + 6 + Math.floor(r() * (VH - GY - 8));
    x.fillStyle = ['#ff8fc8', '#ffd1ec', '#ffe066'][i % 3];
    x.fillRect(fx, fy, 1, 1); x.fillRect(fx - 1, fy + 1, 3, 1); x.fillRect(fx, fy + 2, 1, 1);
  }
  stars = [];
  for (let i = 0; i < VW * GY / 260; i++) stars.push([Math.floor(r() * VW), Math.floor(r() * GY * 0.6), r() * 6]);
  return c;
}

// ---- world state ----
let phase = 'walk';
const kur = { x: 30, y: 0, vy: 0, dir: 1, mode: 'idle', t: 0 };
const cin = { x: 0, y: -70, vy: 0, mode: 'hidden', t: 0 };
const btn = { pressed: false };
const parts = [], sparks = [], tweens = [];
let clouds = [], shake = 0, rain = 0, bigHeart = false, T = 0;
let speaker = null, talking = false;

function tween(o, k, to, dur, ease = t => t) {
  return new Promise(res => tweens.push({ o, k, from: o[k], to, dur, t: 0, ease, res }));
}
const easeOut = t => 1 - (1 - t) ** 3, easeInOut = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;

// ---- input ----
const keys = {};
let xWait = null;
function pressX() { if (xWait) { const f = xWait; xWait = null; f(); } }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
  if (k === 'x') pressX();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('pointerdown', () => window.focus());
document.querySelectorAll('#pad .pbtn').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});
$('#xbtn').addEventListener('pointerdown', e => { e.preventDefault(); pressX(); });
addEventListener('pointerdown', e => { if (xWait && !e.target.closest('#pad')) pressX(); });

// ---- UI helpers ----
const prompt_ = $('#prompt');
function showPrompt(t) { prompt_.textContent = t; prompt_.classList.add('show'); }
function hidePrompt() { prompt_.classList.remove('show'); }
const bubbles = [];
function bubble(ent, html) {
  const el = document.createElement('div'); el.className = 'bubble'; el.innerHTML = html;
  document.body.appendChild(el); const b = { el, ent }; bubbles.push(b); placeBubble(b); return b;
}
function clearBubbles() { bubbles.splice(0).forEach(b => b.el.remove()); }
function placeBubble(b) {
  const head = b.ent === kur ? 48 : 35;
  b.el.style.left = (b.ent.x * S) + 'px';
  b.el.style.top = ((GY + b.ent.y - head) * S) + 'px';
  b.el.style.fontSize = Math.max(12, S * 5.5) + 'px';
}
function heartSVG() {
  let r = '';
  HEART.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '#') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${(x === 1 && y === 1) ? '#fff' : (y > 3 || x > 4 && y > 1) ? '#d81b60' : '#ff3b6b'}"/>`;
  }));
  return `<svg viewBox="0 0 7 6" shape-rendering="crispEdges">${r}</svg>`;
}

async function say(who, name, text) {
  const d = $('#dialog'); speaker = who;
  if (who === 'k') { pc.width = P.fw; pc.height = P.fh; } else { pc.width = C.fw; pc.height = C.fh + 3; }
  $('#dname').textContent = name; const tx = $('#dtext'); tx.textContent = '';
  d.classList.remove('done'); d.classList.add('show'); talking = true;
  await wait(450);
  for (const ch of text) { tx.textContent += ch; await wait(ch === ' ' ? 40 : 70); }
  talking = false; d.classList.add('done');
}
function hideDialog() { $('#dialog').classList.remove('show'); speaker = null; }

function buildTitle(el, lines, cls) {
  el.innerHTML = ''; let i = 0;
  for (const ln of lines) {
    const L = document.createElement('div'); L.className = 'line';
    for (const ch of ln) {
      const o = document.createElement('span'); o.className = 'ch ' + (cls || '');
      o.style.setProperty('--d', (i++ * 0.055).toFixed(3) + 's');
      if (ch === ' ') o.classList.add('sp');
      else { const n = document.createElement('span'); n.className = 'in'; n.innerHTML = ch === '♥' ? heartSVG() : ch; o.appendChild(n); }
      L.appendChild(o);
    }
    el.appendChild(L);
  }
}

// ---- particles ----
function heartPart(x, y, vx, vy, s, life, grav) {
  parts.push({ x, y, vx, vy, s, life, max: life, grav, sway: rnd(0, 6), col: ['#ff3b6b', '#ff8fc8', '#ff5fa8', '#d9a6ff'][Math.floor(rnd(0, 4))] });
}
function burst(x, y, n) {
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), sp = rnd(40, 130); heartPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 60, Math.random() < .3 ? 2 : 1, rnd(1.2, 2.2), 120); }
}

// ---- story ----
async function story() {
  hidePrompt(); $('#pad').style.display = 'none';
  bubble(kur, '¿?');
  await wait(600);
  await say('k', 'Kuromi', '¿?');
  await wait(900);
  hideDialog();
  // Cinnamoroll flies in
  cin.mode = 'fly'; cin.x = VW + 40; cin.y = -70;
  await tween(cin, 'x', BX + 36, 2.0, easeOut);
  cin.mode = 'descend';
  await tween(cin, 'y', 0, 0.8, easeInOut);
  cin.mode = 'idle'; clearBubbles();
  await wait(300);
  cin.mode = 'talk';
  await say('c', 'Cinnamoroll', '¡Presionalooo! :D');
  await wait(1300);
  hideDialog(); cin.mode = 'idle';
  showPrompt(TOUCH ? 'Toca X para presionar el botón' : 'Pulsa X para presionar el botón');
  if (TOUCH) $('#xbtn').style.display = 'block';
  await new Promise(r => xWait = r);
  $('#xbtn').style.display = 'none';
  celebrate();
}

async function celebrate() {
  phase = 'celebrate'; hidePrompt();
  await tween(kur, 'x', BX - 21, 0.12);
  btn.pressed = true;
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  shake = 0.5; burst(BX, GY - 10, 36);
  kur.x = BX - 26;
  kur.mode = 'surprised'; kur.vy = -130; cin.mode = 'surprised'; cin.vy = -110;
  bubble(kur, '!'); bubble(cin, '!');
  await wait(1600);
  clearBubbles();
  kur.mode = 'love'; cin.mode = 'love'; kur.vy = -110; cin.vy = -100;
  bubble(kur, heartSVG()); bubble(cin, heartSVG());
  rain = 1;
  await wait(900);
  buildTitle($('#t1'), ['FELIZ SEGUNDO MES', 'JUNTITOS', 'MI REINITA', 'PRECIOSAAAA ♥♥♥♥']);
  await wait(1500); clearBubbles();
  await wait(8000);
  document.querySelectorAll('#t1 .ch').forEach(c => c.classList.add('bye'));
  await wait(2200);
  $('#t1').innerHTML = '';
  rain = 2; bigHeart = true; burst(VW / 2, VH * 0.35, 50);
  buildTitle($('#t2'), ['TE AMOOO', 'NICOLE', '♥ ♥ ♥'], 'popin');
  await wait(1600); $('#t2').classList.add('beat');
}

// ---- update ----
function update(dt) {
  T += dt; kur.t += dt; cin.t += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t += dt; const p = Math.min(1, w.t / w.dur);
    w.o[w.k] = w.from + (w.to - w.from) * w.ease(p);
    if (p >= 1) { tweens.splice(i, 1); w.res(); }
  }
  if (phase === 'walk') {
    const vx = ((keys.arrowright || keys.d) ? 1 : 0) - ((keys.arrowleft || keys.a) ? 1 : 0);
    if (vx) kur.dir = vx;
    const m = vx ? 'walk' : 'idle'; if (m !== kur.mode) { kur.mode = m; kur.t = 0; }
    kur.x = Math.max(18, kur.x + vx * 55 * dt);
    if (kur.x >= BX - 26) { kur.x = BX - 26; kur.mode = 'idle'; kur.dir = 1; phase = 'story'; story(); }
  }
  for (const e of [kur, cin]) {
    if (e.mode === 'fly' || e.mode === 'descend' || e.mode === 'hidden') continue;
    if (e.vy !== 0 || e.y < 0) {
      e.vy += 420 * dt; e.y += e.vy * dt;
      if (e.y >= 0) { e.y = 0; e.vy = 0; if (e.mode === 'love') e.hop = rnd(0.05, 0.35); }
    } else if (e.mode === 'love') {
      e.hop -= dt; if (e.hop <= 0) e.vy = -rnd(85, 125);
    }
  }
  if (Math.random() < dt * 0.8) heartPart(rnd(0, VW), VH + 6, rnd(-4, 4), -rnd(10, 20), 1, 9, 0); // ambient
  if (rain) for (let i = 0; i < (rain === 2 ? 14 : 8) * dt * 10; i++) if (Math.random() < .1) heartPart(rnd(0, VW), -8, rnd(-10, 10), rnd(25, 55), Math.random() < .25 ? 2 : 1, 8, 6);
  if (phase === 'celebrate') {
    if (Math.random() < dt * 4) heartPart(kur.x + rnd(-6, 6), GY + kur.y - 46, rnd(-8, 8), -rnd(25, 40), 1, 1.6, -5);
    if (Math.random() < dt * 4) heartPart(cin.x + rnd(-6, 6), GY + cin.y - 33, rnd(-8, 8), -rnd(25, 40), 1, 1.6, -5);
    if (Math.random() < dt * 6) sparks.push({ x: rnd(0, VW), y: rnd(0, GY * 0.75), life: .7 });
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.vy += p.grav * dt;
    p.x += (p.vx + Math.sin(T * 2 + p.sway) * 6) * dt; p.y += p.vy * dt;
    if (p.life <= 0 || p.y > VH + 20 || p.y < -30) parts.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) if ((sparks[i].life -= dt) <= 0) sparks.splice(i, 1);
  if (clouds.length === 0) for (let i = 0; i < 4; i++) clouds.push({ x: rnd(0, VW), y: rnd(10, GY * 0.45), sp: rnd(2, 6), w: Math.floor(rnd(16, 30)) });
  for (const c of clouds) { c.x += c.sp * dt; if (c.x > VW + 40) c.x = -40; }
  shake = Math.max(0, shake - dt);
}

// ---- draw ----
function pat(p, x, y, s, col, outline, hi) {
  x = Math.round(x); y = Math.round(y);
  if (outline) { g.fillStyle = outline; p.forEach((r, j) => [...r].forEach((c, i) => { if (c === '#') g.fillRect(x + i * s - 1, y + j * s - 1, s + 2, s + 2); })); }
  g.fillStyle = col; p.forEach((r, j) => [...r].forEach((c, i) => { if (c === '#') g.fillRect(x + i * s, y + j * s, s, s); }));
  if (hi) { g.fillStyle = hi; g.fillRect(x + s, y + s, s, s); }
}
function sprite(img, fw, fh, col, row, x, y, flip, eyes, sc = 1) {
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(flip ? -sc : sc, sc);
  g.drawImage(img, col * fw, row * fh, fw, fh, -fw / 2, -fh, fw, fh);
  if (eyes) for (const [ex, ey] of eyes) pat(EYE, -fw / 2 + ex - 2, -fh + ey - 2, 1, '#ff2d6f', null, null);
  g.restore();
}
function shadow(x, h) { const w = Math.max(6, 18 + h / 4); g.fillStyle = 'rgba(25,8,45,.45)'; g.fillRect(Math.round(x - w / 2), GY - 1, Math.round(w), 2); }

function draw() {
  g.setTransform(4, 0, 0, 4, 0, 0); g.save();
  if (shake > 0) g.translate(Math.round(rnd(-3, 3)), Math.round(rnd(-2, 2)));
  g.drawImage(bg, 0, 0);
  for (const [x, y, ph] of stars) { const a = Math.sin(T * 2 + ph); if (a > -0.3) { g.fillStyle = a > .7 ? '#fff' : '#d9c3ff'; g.fillRect(x, y, 1, 1); if (a > .92) { g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); } } }
  g.fillStyle = 'rgba(255,200,235,.55)';
  for (const c of clouds) { const x = Math.round(c.x), y = Math.round(c.y); g.fillRect(x, y, c.w, 4); g.fillRect(x + 4, y - 3, c.w - 10, 3); g.fillRect(x + 8, y - 5, 8, 2); }
  for (const s of sparks) { g.fillStyle = '#fff6c2'; const r = s.life > .35 ? 2 : 1; g.fillRect(Math.round(s.x) - r, Math.round(s.y), r * 2 + 1, 1); g.fillRect(Math.round(s.x), Math.round(s.y) - r, 1, r * 2 + 1); }

  if (bigHeart) {
    const base = Math.max(3, Math.floor(Math.min(VW, VH) * 0.42 / 7));
    const beat = (T % 1.3) < 0.12 || ((T % 1.3) > 0.3 && (T % 1.3) < 0.42) ? 1 : 0;
    const s = base + beat;
    g.globalAlpha = 0.28; pat(HEART, VW / 2 - 3.5 * s, VH * 0.36 - 3 * s, s, '#ff4f9a', null, '#ffd1ec'); g.globalAlpha = 1;
  }

  // arrows toward the button
  if (phase === 'walk') {
    const blinkOn = Math.sin(T * 6) > -0.4;
    let i = 0;
    for (let x = kur.x + 30; x < BX - 28; x += 18, i++) {
      const lit = ((Math.floor(T * 8) - i) % 4 + 4) % 4 === 0;
      if (!blinkOn && !lit) continue;
      pat(CHEV, x, GY - 30, 2, lit ? '#ffe066' : '#c9a0ef', '#2b1740');
    }
  }
  // button
  const bx = BX;
  g.fillStyle = '#2b1d3a'; g.fillRect(bx - 11, GY - 10, 22, 10);
  g.fillStyle = '#7d7da3'; g.fillRect(bx - 10, GY - 9, 20, 9);
  g.fillStyle = '#a9a9cc'; g.fillRect(bx - 10, GY - 9, 20, 2);
  g.fillStyle = '#5b5b80'; g.fillRect(bx - 10, GY - 2, 20, 2);
  const dh = btn.pressed ? 2 : 6;
  if (!btn.pressed && phase !== 'walk') { g.globalAlpha = 0.3 + 0.3 * Math.sin(T * 6); g.fillStyle = '#ffe066'; g.fillRect(bx - 10, GY - 12 - dh, 20, dh + 4); g.globalAlpha = 1; }
  g.fillStyle = '#2b1d3a'; g.fillRect(bx - 8, GY - 10 - dh, 16, dh + 1); g.fillRect(bx - 7, GY - 11 - dh, 14, 1);
  g.fillStyle = '#ff3b6b'; g.fillRect(bx - 7, GY - 10 - dh, 14, dh);
  g.fillStyle = '#ffb3c8'; g.fillRect(bx - 5, GY - 9 - dh, 4, 1);
  g.fillStyle = '#b0204a'; g.fillRect(bx - 7, GY - 11, 14, 1);

  // characters
  shadow(kur.x, kur.y);
  {
    let row = K.idle[0], col = Math.floor(kur.t * 2.5) % K.idle[1], eyes = null;
    if (kur.mode === 'walk') { row = K.walk[0]; col = Math.floor(kur.t * 10) % K.walk[1]; }
    else if (kur.mode === 'surprised') { row = K.jump[0]; col = 0; }
    else if (kur.mode === 'love') { row = K.love[0]; col = Math.floor(kur.t * 5) % 2; }
    sprite(IMG.k, K.fw, K.fh, col, row, kur.x, GY + kur.y, kur.dir > 0, eyes);
  }
  if (cin.mode !== 'hidden') {
    const flying = cin.mode === 'fly' || cin.mode === 'descend';
    const bob = flying ? Math.sin(T * 5) * 4 * (cin.mode === 'fly' ? 1 : -cin.y / 70) : 0;
    if (!flying) shadow(cin.x, cin.y); else { g.globalAlpha = .5; shadow(cin.x, cin.y); g.globalAlpha = 1; }
    let f = 0, eyes = null;
    if (cin.mode === 'fly') f = Math.floor(T * 6) % 2 ? 2 : 4;
    else if (cin.mode === 'descend') f = 5;
    else if (cin.mode === 'talk') f = Math.floor(T * 4) % 2 ? 11 : 0;
    else if (cin.mode === 'surprised') f = 6;
    else if (cin.mode === 'love') f = 12;
    sprite(IMG.c, C.fw, C.fh, f, 0, cin.x, GY + cin.y + bob, true, eyes, 1.25); // all his frames face right; flip to face Kuromi
  }
  // particles
  for (const p of parts) {
    g.globalAlpha = Math.min(1, p.life / Math.min(1, p.max * .4)) * (p.grav === 0 ? .5 : 1);
    pat(HEART, p.x - 3.5 * p.s, p.y - 3 * p.s, p.s, p.col, '#4a1036', '#fff');
  }
  g.globalAlpha = 1;
  g.restore();
  bubbles.forEach(placeBubble);

  // dialog portrait
  if (speaker) {
    pg.imageSmoothingEnabled = false; pg.clearRect(0, 0, pc.width, pc.height);
    if (speaker === 'k') { const fr = talking ? Math.floor(T * 7) % 4 : 0; pg.drawImage(IMG.p, fr * P.fw, P.fh, P.fw, P.fh, 0, 0, P.fw, P.fh); }
    else { const fr = talking ? (Math.floor(T * 4) % 2 ? 11 : 0) : 0; pg.drawImage(IMG.c, fr * C.fw, 0, C.fw, C.fh, 0, 3, C.fw, C.fh); }
  }
}

let last = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000 || 0, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
async function boot() {
  try { await Promise.race([document.fonts.load('16px "Press Start 2P"'), wait(2500)]); } catch (e) {}
  resize(); addEventListener('resize', resize);
  if (TOUCH) $('#pad').style.display = 'flex';
  showPrompt(TOUCH ? 'Usa ◀ ▶ para caminar' : 'Haz clic aquí y usa las flechas para caminar');
  requestAnimationFrame(t => { last = t; loop(t); });
}
</script></body></html>
